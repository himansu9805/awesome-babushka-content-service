[project]
name = "awesome-babushka-content-service"
version = "0.1.0"
description = "Microservice providing APIs for content related activities for the social network code named Awesome Babushka"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.9.0",
    "awesome-babushka-commons",
    "click==8.2.1",
    "dnspython==2.7.0",
    "fastapi==0.116.1",
    "h11==0.16.0",
    "idna==3.10",
    "pydantic-core==2.33.2",
    "pymongo==4.13.2",
    "python-jose==3.3.0",
    "sniffio==1.3.1",
    "starlette==0.47.2",
    "typing-extensions==4.14.1",
    "typing-inspection==0.4.1",
    "uvicorn==0.35.0",
]

[tool.uv.sources]
awesome-babushka-commons = { git = "https://github.com/himansu9805/awesome-babushka-commons.git", rev = "main" }

[tool.black]
line-length = 79
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 79
